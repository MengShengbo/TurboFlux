name: Developer Flow Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  flow-quality:
    name: Flow quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ci:flow
