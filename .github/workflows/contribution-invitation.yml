name: Invited Contribution Gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: contribution-invitation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-invitation:
    name: Verify contribution invitation
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check author invitation
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const trustedAssociations = new Set([
              'OWNER',
              'MEMBER',
              'COLLABORATOR',
            ]);
            const invitationLabel = 'contribution-invited';
            const commentMarker = '<!-- turboflux-contribution-invitation -->';
            const pullRequest = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const pullNumber = pullRequest.number;
            const author = pullRequest.user?.login;

            if (!author) {
              core.setFailed('Unable to determine the pull request author.');
              return;
            }

            if (trustedAssociations.has(pullRequest.author_association)) {
              core.info(`Trusted repository contributor: ${author}`);
              return;
            }

            const result = await github.graphql(
              `query($owner: String!, $repo: String!, $pullNumber: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pullNumber) {
                    closingIssuesReferences(first: 20) {
                      nodes {
                        number
                        state
                        repository {
                          nameWithOwner
                        }
                        labels(first: 50) {
                          nodes {
                            name
                          }
                        }
                        assignees(first: 50) {
                          nodes {
                            login
                          }
                        }
                      }
                    }
                  }
                }
              }`,
              { owner, repo, pullNumber },
            );

            const issues =
              result.repository?.pullRequest?.closingIssuesReferences?.nodes ?? [];
            const repositoryName = `${owner}/${repo}`.toLowerCase();
            const authorLogin = author.toLowerCase();
            const invitation = issues.find((issue) => {
              const labels = issue.labels.nodes.map((label) =>
                label.name.toLowerCase(),
              );
              const assignees = issue.assignees.nodes.map((assignee) =>
                assignee.login.toLowerCase(),
              );

              return (
                issue.state === 'OPEN' &&
                issue.repository.nameWithOwner.toLowerCase() === repositoryName &&
                labels.includes(invitationLabel) &&
                assignees.includes(authorLogin)
              );
            });

            if (invitation) {
              core.info(
                `Invitation verified for ${author} through issue #${invitation.number}.`,
              );
              return;
            }

            const body = `${commentMarker}
            Thanks for your interest in contributing to TurboFlux.

            External pull requests are accepted only after a maintainer invites the author through an issue. The linked issue must:

            - be open in this repository;
            - have the \`${invitationLabel}\` label;
            - be assigned to \`@${author}\`;
            - be linked from this pull request with \`Closes #<issue-number>\`.

            This pull request has been closed automatically. After a maintainer records an invitation, update the pull request body and reopen it. See [CONTRIBUTING.md](https://github.com/${owner}/${repo}/blob/main/CONTRIBUTING.md) for details.`;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: pullNumber, per_page: 100 },
            );
            const existingComment = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(commentMarker),
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullNumber,
                body,
              });
            }

            if (pullRequest.state !== 'closed') {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pullNumber,
                state: 'closed',
              });
            }

            core.setFailed(
              `No valid contribution invitation was found for ${author}.`,
            );
